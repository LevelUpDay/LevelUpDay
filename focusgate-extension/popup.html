<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Focusgate</title>
<style>
  :root { color-scheme: dark; --a: #7C5CFC; --t: #F0EEF8; --m: rgba(240,238,248,.55); --s: #18181F; --s2: #22222C; --b: rgba(255,255,255,.08); }
  * { box-sizing: border-box; }
  body { margin: 0; width: 320px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--t); background: #0E0E12; }
  .hero { padding: 16px; background: radial-gradient(120% 140% at 100% 0%, rgba(124,92,252,.35), transparent 60%), var(--s); border-bottom: 1px solid var(--b); }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(145deg, #7C5CFC, #c056e0); }
  .brand b { display: block; font-size: 16px; } .brand small { color: var(--m); font-size: 11.5px; }
  .pill { margin-left: auto; font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 999px; background: rgba(52,211,153,.14); color: #34D399; }
  .pill.off { background: rgba(255,255,255,.07); color: var(--m); }
  .total { margin-top: 14px; display: flex; align-items: baseline; gap: 8px; } .total b { font-size: 26px; } .total span { color: var(--m); font-size: 12px; }
  .focus { margin-top: 10px; padding: 8px 10px; border-radius: 10px; background: rgba(124,92,252,.18); font-size: 13px; font-weight: 600; display: none; }
  .body { padding: 12px 16px 16px; }
  .t { font-size: 11px; font-weight: 700; color: var(--m); text-transform: uppercase; letter-spacing: .5px; margin: 4px 0 8px; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; margin-bottom: 8px; font-size: 13px; }
  .row i { grid-column: 1 / -1; height: 5px; border-radius: 5px; background: var(--s2); overflow: hidden; } .row i s { display: block; height: 100%; background: var(--a); border-radius: inherit; }
  .row b { font-weight: 600; } .row em { font-style: normal; color: var(--m); font-size: 12px; }
  .empty { color: var(--m); font-size: 12.5px; padding: 8px 0 12px; }
  .btns { display: flex; gap: 8px; margin-top: 8px; }
  button, a { flex: 1; border: 0; border-radius: 12px; padding: 11px; font: 700 13px system-ui, sans-serif; cursor: pointer; text-align: center; text-decoration: none; }
  .p { background: var(--a); color: #fff; } .g { background: var(--s2); color: var(--t); }
  .note.upd { color: #fff; background: rgba(124,92,252,.18); border: 1px solid rgba(124,92,252,.5); border-radius: 10px; padding: 8px 10px; } .note.upd a { color: #c4b5fd; font-weight: 700; }
  .note { font-size: 12px; color: var(--m); line-height: 1.5; margin: 6px 0 10px; }
  .code { font: 800 22px ui-monospace, monospace; letter-spacing: 3px; color: var(--a); text-align: center; padding: 10px; border-radius: 12px; background: var(--s2); margin-bottom: 8px; }
</style>
</head>
<body>
  <div class="hero">
    <div class="brand">
      <span class="logo"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 2.5 4.5 5.4v6.1c0 4.7 3.2 8.6 7.5 10 4.3-1.4 7.5-5.3 7.5-10V5.4L12 2.5Z" fill="rgba(255,255,255,.22)" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/><path d="m8.6 12.2 2.4 2.4 4.6-4.8" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <div><b>Focusgate</b><small id="dev">LevelUpDay</small></div>
      <span class="pill off" id="st">…</span>
    </div>
    <div class="total"><b id="total">0 daq</b><span id="totalL">bugun saytlarda</span></div>
    <div class="focus" id="focus"></div>
  </div>
  <div class="body" id="body"></div>
  <script src="popup.js" type="module"></script>
</body>
</html>
