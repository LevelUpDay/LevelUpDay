<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- LevelUpDay: chiqayotgan quyosh (Day) + uchta daraja chevroni (Level Up) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#5B3BFF"/>
      <stop offset="0.6" stop-color="#9A4DFF"/>
      <stop offset="1" stop-color="#FF4F9A"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF4B0"/>
      <stop offset="0.7" stop-color="#FFD23F"/>
      <stop offset="1" stop-color="#FFB020"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD23F" stop-opacity="0.55"/>
