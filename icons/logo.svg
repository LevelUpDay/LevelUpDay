    <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="40">
      <path d="M150 300 L256 222 L362 300" stroke="#FFFFFF"/>
      <path d="M150 372 L256 294 L362 372" stroke="#FFFFFF" stroke-opacity="0.78"/>
      <path d="M150 444 L256 366 L362 444" stroke="#FFFFFF" stroke-opacity="0.5"/>
    </g>
